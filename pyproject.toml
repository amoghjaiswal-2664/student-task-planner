[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planner"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "groq", "python-dotenv", "typer", "rich","google-api-python-client", "google-auth-oauthlib"]

[tool.setuptools.packages.find]
where = ["src"]